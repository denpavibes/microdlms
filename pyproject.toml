[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microdlms"
version = "0.1.4"
description = "Lightweight, zero-core-dependency DLMS/COSEM meter client for Python 3.14+"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "denpamusic" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "serialx>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
    "codespell>=2.4",
    "complexipy>=8.0.1",
]
esphome = [
    "serialx[esphome]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/microdlms"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/meter_fixtures.py" = ["E501"]

[tool.codespell]
ignore-words-list = "aare"
skip = "*.json,raw_frames.log,.git"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "serialx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=microdlms --cov-report=term-missing --cov-fail-under=95"

[tool.complexipy]
max-complexity-allowed = 15

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
    "codespell>=2.4",
    "complexipy>=8.0.1",
    "serialx[esphome]",
]



<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title description">
  <title id="title">Utility meter talking to a microcontroller</title>
  <desc id="description">A minimalist smart meter sends HDLC frames through its optical port to a tiny microcontroller, which turns them into readings.</desc>

  <defs>
    <path id="sparkle" d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z"/>
    <path id="heart" d="M0 6 C -7 1 -8 -5 -4 -6 C -2 -6.5 0 -5 0 -3.5 C 0 -5 2 -6.5 4 -6 C 8 -5 7 1 0 6 Z"/>
    <path id="plus" d="M-6 0 H6 M0 -6 V6"/>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.6" fill="#B8BECB"/>
    </pattern>
    <path id="beam" d="M420 205 C 500 205 520 130 600 135 S 760 175 832 160"/>
  </defs>

  <!-- Background clutter -->
  <rect width="1200" height="320" fill="url(#dots)" opacity="0.35"/>

  <g fill="none" stroke="#B8BECB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- HUD corner brackets -->
    <path d="M24 56 V24 H56"/>
    <path d="M1144 24 H1176 V56"/>
    <path d="M1176 264 V296 H1144"/>
    <path d="M56 296 H24 V264"/>
    <!-- Circuit traces -->
    <path d="M900 84 V52 H1010"/>
    <path d="M870 236 V272 H760"/>
    <path d="M930 236 V282 H1120"/>
    <path d="M150 120 H96 V200 H60"/>
  </g>
  <g fill="#B8BECB">
    <circle cx="1016" cy="52" r="5"/>
    <circle cx="754" cy="272" r="5"/>
    <circle cx="1126" cy="282" r="5"/>
    <circle cx="54" cy="200" r="5"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#B8BECB" letter-spacing="2">
    <text x="420" y="58">7E A0</text>
    <text x="500" y="290">E6 E6 00</text>
    <text x="1040" y="100">C4 01</text>
  </g>

  <use href="#sparkle" transform="translate(112 64) scale(1.2)" fill="#FF6FAE"/>
  <use href="#sparkle" transform="translate(560 64) scale(0.9)" fill="#2EC4B6"/>
  <use href="#sparkle" transform="translate(660 258) scale(0.8)" fill="#FF6FAE"/>
  <use href="#sparkle" transform="translate(1130 150) scale(1.1)" fill="#2EC4B6"/>
  <use href="#sparkle" transform="translate(740 70) scale(0.7)" fill="#B8BECB"/>
  <use href="#sparkle" transform="translate(64 270) scale(0.8)" fill="#B8BECB"/>
  <use href="#sparkle" transform="translate(390 270) scale(0.7)" fill="#2EC4B6"/>

  <use href="#heart" transform="translate(470 250) scale(1.4)" fill="none" stroke="#FF6FAE" stroke-width="1.6"/>
  <use href="#heart" transform="translate(1150 214) scale(1.2)" fill="none" stroke="#B8BECB" stroke-width="1.8"/>
  <use href="#heart" transform="translate(680 110) scale(1.1)" fill="none" stroke="#B8BECB" stroke-width="1.8"/>

  <g fill="none" stroke="#B8BECB" stroke-width="3" stroke-linecap="round">
    <use href="#plus" transform="translate(380 110)"/>
    <use href="#plus" transform="translate(800 250)"/>
    <use href="#plus" transform="translate(1160 100)"/>
  </g>

  <!-- Smart meter -->
  <rect x="150" y="70" width="200" height="190" rx="28" fill="#F4F5F8" stroke="#8E95A5" stroke-width="4"/>
  <rect x="175" y="95" width="150" height="60" rx="12" fill="#2EC4B6"/>
  <path d="M188 128 H214 L222 110 L232 144 L242 118 L249 128 H312" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="186" cy="190" r="6" fill="#FF6FAE">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <rect x="176" y="214" width="34" height="7" rx="3.5" fill="#B8BECB"/>
  <rect x="176" y="230" width="22" height="7" rx="3.5" fill="#B8BECB"/>
  <circle cx="262" cy="205" r="28" fill="#FF6FAE" stroke="#8E95A5" stroke-width="4"/>
  <circle cx="262" cy="205" r="11" fill="#FFFFFF"/>

  <!-- Radio waves -->
  <g fill="none" stroke="#FF6FAE" stroke-width="4" stroke-linecap="round">
    <path d="M366 190 A 20 20 0 0 1 366 220" opacity="0.9"/>
    <path d="M380 178 A 34 34 0 0 1 380 232" opacity="0.55"/>
    <path d="M394 166 A 48 48 0 0 1 394 244" opacity="0.25"/>
  </g>

  <!-- Data beam with travelling HDLC frames -->
  <use href="#beam" fill="none" stroke="#B8BECB" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <g>
      <rect x="-24" y="-13" width="48" height="26" rx="13" fill="#2EC4B6"/>
      <text y="4.5">7E</text>
      <animateMotion dur="6s" repeatCount="indefinite" begin="0s"><mpath href="#beam"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6s" repeatCount="indefinite" begin="0s"/>
    </g>
    <g>
      <rect x="-24" y="-13" width="48" height="26" rx="13" fill="#FF6FAE"/>
      <text y="4.5">7E</text>
      <animateMotion dur="6s" repeatCount="indefinite" begin="-2s"><mpath href="#beam"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6s" repeatCount="indefinite" begin="-2s"/>
    </g>
    <g>
      <rect x="-24" y="-13" width="48" height="26" rx="13" fill="#2EC4B6"/>
      <text y="4.5">7E</text>
      <animateMotion dur="6s" repeatCount="indefinite" begin="-4s"><mpath href="#beam"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="6s" repeatCount="indefinite" begin="-4s"/>
    </g>
  </g>

  <!-- Microcontroller -->
  <g fill="#8E95A5">
    <rect x="865" y="84" width="10" height="18" rx="5"/>
    <rect x="895" y="84" width="10" height="18" rx="5"/>
    <rect x="925" y="84" width="10" height="18" rx="5"/>
    <rect x="865" y="218" width="10" height="18" rx="5"/>
    <rect x="895" y="218" width="10" height="18" rx="5"/>
    <rect x="925" y="218" width="10" height="18" rx="5"/>
    <rect x="824" y="125" width="18" height="10" rx="5"/>
    <rect x="824" y="185" width="18" height="10" rx="5"/>
    <rect x="958" y="125" width="18" height="10" rx="5"/>
    <rect x="958" y="185" width="18" height="10" rx="5"/>
  </g>
  <rect x="840" y="100" width="120" height="120" rx="22" fill="#F4F5F8" stroke="#8E95A5" stroke-width="4"/>
  <rect x="865" y="125" width="70" height="70" rx="14" fill="#2EC4B6"/>
  <use href="#heart" transform="translate(900 161) scale(3)" fill="#FF6FAE" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Readings -->
  <path d="M962 160 H994" fill="none" stroke="#B8BECB" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
  <rect x="1012" y="170" width="20" height="50" rx="10" fill="#2EC4B6"/>
  <rect x="1044" y="140" width="20" height="80" rx="10" fill="#FF6FAE"/>
  <rect x="1076" y="118" width="20" height="102" rx="10" fill="#F4F5F8" stroke="#8E95A5" stroke-width="3"/>
  <path d="M1000 232 H1108" fill="none" stroke="#8E95A5" stroke-width="4" stroke-linecap="round"/>
</svg>
